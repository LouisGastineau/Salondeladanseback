server {
    listen 80;
    listen [::]:80;
    server_name vps123961.serveur-vps.net;
    root /var/www/back/public;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vps123961.serveur-vps.net;
    root /var/www/back/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/vps123961.serveur-vps.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps123961.serveur-vps.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 3m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
